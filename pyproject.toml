[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "niep"
version = "1.1.0"
description = "NFV Infrastructure Emulation Platform"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [{name = "NIEP Research Group"}]
dependencies = [
  "docker>=7.1,<8",
  "flask>=2.3,<4",
  "psutil>=5.9,<7",
  "requests>=2.31,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "setuptools>=68",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "pytest-timeout>=2.3,<3",
  "ruff==0.8.6",
]
integration = [
  "pexpect>=4.9,<5",
]

[project.scripts]
niepctl = "niep.interfaces.niepctl:main"
niepd = "niep.interfaces.niepd:main"

[tool.setuptools.packages.find]
include = ["niep*"]
exclude = ["niep.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-config --strict-markers -m 'not privileged'"
timeout = 10

markers = [
  "unit: host-only tests of pure behavior and validation",
  "contract: tests of stable service/parser/teardown contracts",
  "integration: tests that require external runtimes or a provisioned host",
  "smoke: end-to-end command or socket smoke checks",
  "privileged: tests requiring root, Docker, libvirt, Mininet, or host networking",
]

[tool.coverage.run]
branch = true
source = ["niep"]
omit = [
  "OFCONTROLLERS/pox/*",
  "*/OFCONTROLLERS/pox/*",
  "*/tests/*",
  "*/tools/smoke/*",
  "*/tests/integration/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["OFCONTROLLERS/pox", "build", ".venv"]

[tool.ruff.format]
quote-style = "double"
